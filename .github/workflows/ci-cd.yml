name: CI/CD Pipeline01

on:
  push:
    branches:
      - main

  workflow_dispatch:  
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify application
        run: |
          python -c "from main import app; print('FastAPI application loaded successfully')"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deployment successful
        run: echo "CI checks passed. Render will deploy the latest commit."
